<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המבוך</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6778;
      --paper: #f6f3ee;
      --card: #fffdf9;
      --accent: #1f6f5b;
      --line: #e4ddd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #efe6d6 0, transparent 36%),
        radial-gradient(circle at 90% 90%, #dceee7 0, transparent 32%),
        var(--paper);
      display: grid;
      place-items: center;
      padding: 24px 16px 62px;
    }

    .wrap { width: min(760px, 100%); }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    h1 { margin: 0; font-size: 1.6rem; }

    .stats {
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .stats .stage { color: var(--accent); }
    .stats .deaths { color: #b4483c; }
    .stats .best { color: var(--muted); font-size: 0.85rem; }

    .board-shell {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 18px 50px rgba(40, 32, 20, 0.08);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
      background: #f3efe7;
      touch-action: none;
    }

    .pad {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .pad button {
      width: 62px;
      height: 46px;
      padding: 0;
      font-size: 1.15rem;
      border-radius: 14px;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .bar kbd {
      font: inherit;
      font-size: 0.8rem;
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #faf7f1;
    }

    /* --- ניווט: כפתור בית קבוע ותפריט צד למעבר בין המשחקים --- */
    .home-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 40;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(40, 32, 20, 0.14);
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .home-btn:hover,
    .home-btn:focus-visible {
      transform: translateY(-2px);
      background: var(--accent);
      color: #fff;
    }

    .home-btn svg { width: 22px; height: 22px; }

    .rail {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 6px;
      padding: 6px;
      background: rgba(255, 253, 249, 0.9);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(40, 32, 20, 0.12);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .rail a {
      position: relative;
      display: block;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      outline-offset: 2px;
    }

    .rail a img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 9px;
      object-fit: cover;
    }

    .rail a:hover,
    .rail a:focus-visible { border-color: var(--accent); }

    .rail a span {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 50%;
      transform: translateX(50%) translateY(4px);
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .rail a:hover span,
    .rail a:focus-visible span { opacity: 1; transform: translateX(50%) translateY(0); }

    @media (min-width: 900px) {
      body { padding-right: 78px; }

      .rail {
        top: 50%;
        bottom: auto;
        left: auto;
        right: 14px;
        transform: translateY(-50%);
        flex-direction: column;
      }

      .rail a span {
        bottom: auto;
        top: 50%;
        right: calc(100% + 8px);
        transform: translateY(-50%) translateX(4px);
      }

      .rail a:hover span,
      .rail a:focus-visible span { transform: translateY(-50%) translateX(0); }
    }

    @media (max-width: 899px) {
      .wrap header { padding-left: 58px; }
    }

    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
    }

    button:hover { background: #185a4a; }

    button.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--line);
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    button.ghost:hover { background: #f1ece2; }

    /* --- בחירת שלבים --- */
    .picker {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(28, 36, 48, 0.35);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }

    .picker[hidden] { display: none; }

    .picker-card {
      width: min(560px, 100%);
      max-height: 86vh;
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(28, 36, 48, 0.24);
    }

    .picker-card header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .picker-card h2 { margin: 0; font-size: 1.1rem; }

    .world-title {
      margin: 14px 0 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 6px;
    }

    .grid button {
      height: 42px;
      padding: 0;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .grid button:disabled {
      background: #f1ece2;
      color: #b9b1a5;
      cursor: not-allowed;
    }

    .grid button.current { outline: 2px solid var(--accent); outline-offset: 2px; }

    .overlay {
      position: absolute;
      inset: 12px;
      border-radius: 14px;
      background: rgba(255, 253, 249, 0.94);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }

    .overlay[hidden] { display: none; }

    .overlay h2 { margin: 0 0 8px; }
    .overlay p { margin: 0 0 18px; color: var(--muted); }
  </style>
</head>
<body>
  <a class="home-btn" href="index.html" aria-label="חזרה לעמוד הבית" title="חזרה לעמוד הבית">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5"></path>
      <path d="M5.5 9.5V20h13V9.5"></path>
      <path d="M10 20v-5.5h4V20"></path>
    </svg>
  </a>
  <nav class="rail" aria-label="משחקים אחרים">
    <a href="snake.html"><img src="assets/tile-snake.webp?v=1" alt="סנייק"><span>סנייק</span></a>
    <a href="tetris.html"><img src="assets/tile-tetris.webp?v=1" alt="טטריס"><span>טטריס</span></a>
    <a href="runner.html"><img src="assets/tile-runner.webp?v=1" alt="משחק דינוזאור"><span>משחק דינוזאור</span></a>
    <a href="doodle.html"><img src="assets/tile-doodle.webp?v=1" alt="דודלג'אמפ"><span>דודלג'אמפ</span></a>
  </nav>
  <div class="wrap">
    <header>
      <h1>המבוך</h1>
      <div class="stats">
        <span class="stage">שלב <span id="stage">1</span>/<span id="total">25</span></span>
        <span class="deaths">פסילות: <span id="deaths">0</span></span>
        <span class="best">שיא: <span id="best">—</span></span>
      </div>
    </header>
    <div class="board-shell">
      <canvas id="game" width="640" height="400"></canvas>
      <div class="overlay" id="overlay" hidden>
        <div>
          <h2 id="overlay-title">יצאת מהמבוך!</h2>
          <p id="overlay-text">כל עשרת העולמות. גם אלה שנראים כמו הסוף.</p>
          <button type="button" id="overlay-btn">מהתחלה</button>
        </div>
      </div>
    </div>
    <div class="pad">
      <button type="button" data-act="left" aria-label="שמאלה">←</button>
      <button type="button" data-act="jump" aria-label="קפיצה">↑</button>
      <button type="button" data-act="right" aria-label="ימינה">→</button>
    </div>
    <div class="bar">
      <span><kbd>חצים</kbd> או <kbd>WASD</kbd> לזוז, <kbd>רווח</kbd> לקפוץ, <kbd>R</kbd> להתחלה מחדש</span>
      <button type="button" class="ghost" id="menu-btn">בחירת שלב</button>
    </div>
  </div>

  <div class="picker" id="picker" hidden>
    <div class="picker-card">
      <header>
        <h2>בחירת שלב</h2>
        <button type="button" class="ghost" id="picker-close">סגור</button>
      </header>
      <div id="picker-body"></div>
    </div>
  </div>

  <script src="scores.js"></script>
  <script src="maze-levels.js?v=15"></script>
  <script src="maze-engine.js?v=15"></script>
  <script>
    /*
     * חיבור המנוע לממשק: תצוגת שלב/פסילות/שיא, תפריט בחירת שלבים,
     * ושמירת השלב האחרון שנפתח (localStorage, דרך המנוע).
     */
    (function () {
      const stageEl = document.getElementById("stage");
      const totalEl = document.getElementById("total");
      const deathsEl = document.getElementById("deaths");
      const bestEl = document.getElementById("best");
      const picker = document.getElementById("picker");
      const pickerBody = document.getElementById("picker-body");
      const overlay = document.getElementById("overlay");
      const overlayBtn = document.getElementById("overlay-btn");

      const LEVELS = window.MazeLevels || [];
      const WORLD_NAMES = ["", "עולם 1 — בורות ורצפה בוגדנית", "עולם 2 — דוקרנים, מסורים וקירות",
        "עולם 3 — דלתות מתעללות ושיגורים", "עולם 4 — שבירת חוקים והיפוכים", "עולם 5 — כאוס משולב",
        "עולם 6 — קפיצות ושינויי מצב", "עולם 7 — מסורים, כדורים ומגרסות",
        "עולם 8 — מפתחות וטריקים פסיכולוגיים", "עולם 9 — חושך, רוח וכפילים",
        "עולם 10 — גיהנום מוחלט"];

      let current = { stage: 1, total: LEVELS.length, deaths: 0, best: 1, unlocked: 1 };

      function renderPicker() {
        pickerBody.textContent = "";
        for (let world = 1; world <= WORLD_NAMES.length - 1; world++) {
          const title = document.createElement("div");
          title.className = "world-title";
          title.textContent = WORLD_NAMES[world];
          pickerBody.appendChild(title);

          const grid = document.createElement("div");
          grid.className = "grid";
          LEVELS.forEach((level, index) => {
            if (level.world !== world) return;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = String(index + 1);
            btn.title = level.name;
            btn.disabled = index + 1 > current.unlocked;
            if (index + 1 === current.stage) btn.classList.add("current");
            btn.addEventListener("click", () => {
              window.MazeGame.goto(index);
              picker.hidden = true;
            });
            grid.appendChild(btn);
          });
          pickerBody.appendChild(grid);
        }
      }

      window.addEventListener("maze:hud", event => {
        current = event.detail;
        stageEl.textContent = String(current.stage);
        totalEl.textContent = String(current.total);
        deathsEl.textContent = String(current.deaths);
        bestEl.textContent = current.best > 1 ? "שלב " + current.best : "—";
        if (!picker.hidden) renderPicker();
        if (current.win) {
          overlay.hidden = false;
        }
      });

      document.getElementById("menu-btn").addEventListener("click", () => {
        renderPicker();
        picker.hidden = false;
      });

      document.getElementById("picker-close").addEventListener("click", () => {
        picker.hidden = true;
      });

      picker.addEventListener("click", event => {
        if (event.target === picker) picker.hidden = true;
      });

      window.addEventListener("maze:menu", () => {
        renderPicker();
        picker.hidden = false;
      });

      overlayBtn.addEventListener("click", () => {
        overlay.hidden = true;
        window.MazeGame.goto(0);
      });

      // ממשיכים מהשלב האחרון שנפתח (המנוע שומר אותו ב־localStorage)
      let start = 0;
      try {
        const saved = Number(localStorage.getItem("maze:unlocked"));
        if (Number.isFinite(saved) && saved > 0) {
          start = Math.min(saved, LEVELS.length) - 1;
        }
      } catch (error) {
        start = 0;
      }

      window.MazeGame.start(start);
    })();
  </script>
</body>
</html>
