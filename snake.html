<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סנייק</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6778;
      --paper: #f6f3ee;
      --card: #fffdf9;
      --accent: #1f6f5b;
      --line: #e4ddd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #efe6d6 0, transparent 36%),
        radial-gradient(circle at 90% 90%, #dceee7 0, transparent 32%),
        var(--paper);
      display: grid;
      place-items: center;
      padding: 28px 16px 62px;
    }

    .wrap {
      width: min(640px, 100%);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .score {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.15rem;
    }

    .score .best {
      display: block;
      margin-top: 2px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
    }

    .board-shell {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 18px 50px rgba(40, 32, 20, 0.08);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      background: #f3efe7;
      touch-action: none;
    }

    /* --- ניווט: כפתור בית קבוע ותפריט צד למעבר בין המשחקים --- */
    .home-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 40;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(40, 32, 20, 0.14);
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .home-btn:hover,
    .home-btn:focus-visible {
      transform: translateY(-2px);
      background: var(--accent);
      color: #fff;
    }

    .home-btn svg { width: 22px; height: 22px; }

    /* במסך צר התפריט יושב בתחתית; במסך רחב הוא עובר לעמודה בצד */
    .rail {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 6px;
      padding: 6px;
      background: rgba(255, 253, 249, 0.9);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(40, 32, 20, 0.12);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .rail a {
      position: relative;
      display: block;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      outline-offset: 2px;
    }

    .rail a img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 9px;
      object-fit: cover;
    }

    .rail a:hover,
    .rail a:focus-visible { border-color: var(--accent); }

    .rail a span {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 50%;
      transform: translateX(50%) translateY(4px);
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .rail a:hover span,
    .rail a:focus-visible span { opacity: 1; transform: translateX(50%) translateY(0); }

    @media (min-width: 900px) {
      body { padding-right: 78px; }

      .rail {
        top: 50%;
        bottom: auto;
        left: auto;
        right: 14px;
        transform: translateY(-50%);
        flex-direction: column;
      }

      .rail a span {
        bottom: auto;
        top: 50%;
        right: calc(100% + 8px);
        transform: translateY(-50%) translateX(4px);
      }

      .rail a:hover span,
      .rail a:focus-visible span { transform: translateY(-50%) translateX(0); }
    }

    @media (max-width: 899px) {
      /* מקום לכפתור הבית, כדי שלא יכסה את הכותרת */
      .wrap header { padding-left: 58px; }
    }

    .overlay {
      position: absolute;
      inset: 16px;
      border-radius: 16px;
      background: rgba(255, 253, 249, 0.9);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      overflow-y: auto;
    }

    .overlay[hidden] { display: none; }

    .overlay h2 { margin: 0 0 8px; }

    .overlay p { margin: 0 0 18px; color: var(--muted); }

    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 999px;
      cursor: pointer;
    }

    button:hover { background: #185a4a; }

    .speeds {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .speeds button {
      background: #efe9de;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 8px 14px;
    }

    .speeds button:hover { background: #e4dccd; }

    .speeds button.is-on {
      background: var(--accent);
      color: #fff;
    }

    .speeds button.is-on:hover { background: #185a4a; }

    .speed-hint {
      font-size: 0.85rem;
      margin-top: -6px;
    }

    /* --- לוח המובילים היומי --- */
    .leaders {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px 20px 6px;
      box-shadow: 0 18px 50px rgba(40, 32, 20, 0.08);
    }

    .leaders h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .leaders table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .leaders th,
    .leaders td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
    }

    .leaders th {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      background: #efe9de;
    }

    .leaders tr:last-child td { border-bottom: 0; }

    .leaders td.rank {
      width: 42px;
      font-weight: 700;
      color: var(--accent);
    }

    .leaders td.value {
      width: 96px;
      font-weight: 700;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }

    .leaders tr.top td { color: var(--accent); }

    .leaders td.empty {
      padding: 16px 10px;
      text-align: center;
      color: var(--muted);
    }

    /* --- טופס כניסה לטבלה אחרי שיא --- */
    .record .record-label {
      margin: 0 0 10px;
      color: var(--ink);
      font-weight: 700;
    }

    .record-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .record input {
      width: min(210px, 100%);
      padding: 11px 16px;
      font: inherit;
      color: var(--ink);
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .record input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .record .ghost {
      background: #efe9de;
      color: var(--muted);
    }

    .record .ghost:hover { background: #e4dccd; }
  </style>
</head>
<body>
  <a class="home-btn" href="index.html" aria-label="חזרה לעמוד הבית" title="חזרה לעמוד הבית">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5"></path>
      <path d="M5.5 9.5V20h13V9.5"></path>
      <path d="M10 20v-5.5h4V20"></path>
    </svg>
  </a>
  <nav class="rail" aria-label="משחקים אחרים">
    <a href="maze.html"><img src="assets/tile-maze.webp?v=1" alt="מבוך"><span>מבוך</span></a>
    <a href="tetris.html"><img src="assets/tile-tetris.webp?v=1" alt="טטריס"><span>טטריס</span></a>
    <a href="runner.html"><img src="assets/tile-runner.webp?v=1" alt="משחק דינוזאור"><span>משחק דינוזאור</span></a>
    <a href="doodle.html"><img src="assets/tile-doodle.webp?v=1" alt="דודלג'אמפ"><span>דודלג'אמפ</span></a>
  </nav>
  <div class="wrap">
    <header>
      <h1>סנייק</h1>
      <div class="score">ניקוד: <span id="score">0</span><span class="best">שיא: <span id="best">0</span></span></div>
    </header>
    <div class="board-shell">
      <canvas id="board" width="560" height="560"></canvas>
      <div class="overlay" id="overlay" hidden>
        <div>
        <h2 id="overlay-title">סנייק</h2>
        <p id="overlay-text">לחצו על חץ כדי להתחיל</p>
        <form class="record" id="record-form" hidden>
          <p class="record-label" id="record-label"></p>
          <div class="record-row">
            <input id="record-name" type="text" maxlength="14" placeholder="השם שלך" autocomplete="off" aria-label="שם ללוח המובילים">
            <button type="submit">שמור</button>
            <button type="button" class="ghost" id="record-skip">לא תודה</button>
          </div>
        </form>
        <div class="speeds" id="speeds" role="group" aria-label="מהירות המשחק">
          <button type="button" class="speed" data-ms="230">איטי</button>
          <button type="button" class="speed is-on" data-ms="160">רגיל</button>
          <button type="button" class="speed" data-ms="110">מהיר</button>
          <button type="button" class="speed" data-ms="70">מטורף</button>
        </div>
        <p class="speed-hint">הניקוד נספר רק במהירות הרגילה, ולכל מהירות שיא משל עצמה</p>
        <button type="button" id="again">התחל</button>
        </div>
      </div>
    </div>
    <section class="leaders" aria-labelledby="leaders-title">
      <h2 id="leaders-title">לוח המובילים של היום — מהירות רגילה</h2>
      <table>
        <thead>
          <tr><th scope="col">מקום</th><th scope="col">שם</th><th scope="col">ניקוד</th></tr>
        </thead>
        <tbody id="leaders-body"></tbody>
      </table>
    </section>
  </div>
  <script>
    /* סנייק - נחש על לוח 10x10. reset, spawnFood, setDir, update, draw, loop, begin. */
    const COLS = 10;
    const ROWS = 10;
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const cell = canvas.width / COLS;
    const scoreEl = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayText = document.getElementById("overlay-text");
    const againBtn = document.getElementById("again");
    const speedBtns = document.querySelectorAll(".speed");
    const leadersBody = document.getElementById("leaders-body");
    const recordForm = document.getElementById("record-form");
    const recordLabel = document.getElementById("record-label");
    const recordName = document.getElementById("record-name");
    const recordSkip = document.getElementById("record-skip");
    const bestEl = document.getElementById("best");
    let speedMs = 160;
    const NORMAL_SPEED = 160;

    // הניקוד נספר רק במהירות הרגילה — בשאר המהירויות המשחק הוא אימון בלי ניקוד
    function scoreCounts() {
      return speedMs === NORMAL_SPEED;
    }

    // צליל "קאצ'ינג" קצר בכל אכילת שטר — מסונתז ב־WebAudio, בלי קובץ סאונד
    let audioCtx = null;
    let noiseBuffer = null;

    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function getNoise(ac) {
      if (noiseBuffer) return noiseBuffer;
      const length = Math.floor(ac.sampleRate * 0.2);
      noiseBuffer = ac.createBuffer(1, length, ac.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / length);
      }
      return noiseBuffer;
    }

    function playCash(bonus) {
      const ac = ensureAudio();
      if (!ac) return;
      const t0 = ac.currentTime;

      // רשרוש השטר
      const rustle = ac.createBufferSource();
      rustle.buffer = getNoise(ac);
      const band = ac.createBiquadFilter();
      band.type = "bandpass";
      band.frequency.value = 2600;
      band.Q.value = 0.7;
      const rustleGain = ac.createGain();
      rustleGain.gain.setValueAtTime(0.0001, t0);
      rustleGain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.012);
      rustleGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.17);
      rustle.connect(band).connect(rustleGain).connect(ac.destination);
      rustle.start(t0);
      rustle.stop(t0 + 0.18);

      // צלצול מטבעות מעל הרשרוש (לשטר הזהוב יש צליל גבוה נוסף)
      const notes = bonus ? [1318.5, 1975.5, 2637] : [1318.5, 1975.5];
      notes.forEach((freq, i) => {
        const at = t0 + i * 0.055;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, at);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(bonus ? 0.14 : 0.11, at + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.3);
        osc.connect(gain).connect(ac.destination);
        osc.start(at);
        osc.stop(at + 0.32);
      });
    }

    const face = new Image();
    face.src = "assets/face.png?v=2";
    // שטרות ומטבעות — כל פריט שווה בדיוק לפי הערך שנקוב עליו
    const MONEY = [
      { value: 200, front: "assets/bill-200-front.webp", back: "assets/bill-200-back.webp" },
      { value: 100, front: "assets/bill-100-front.webp?v=1", back: "assets/bill-100-back.webp?v=1" },
      { value: 50, front: "assets/bill-50-front.webp?v=1", back: "assets/bill-50-back.webp?v=1" },
      { value: 20, front: "assets/bill-20-front.webp?v=1", back: "assets/bill-20-back.webp?v=1" },
      { value: 10, front: "assets/coin-10.webp?v=1", back: "assets/coin-10.webp?v=1" }
    ];

    MONEY.forEach(item => {
      item.frontImg = new Image();
      item.frontImg.src = item.front;
      item.backImg = new Image();
      item.backImg.src = item.back;
      item.frontImg.addEventListener("load", draw);
      item.backImg.addEventListener("load", draw);
    });

    // שטרות זהובים: שווים פי 18 מהערך שלהם, והערך יורד בקצב קבוע עד שהם נעלמים אחרי 6 שניות
    const GOLD_FACTOR = 18;
    const GOLD_SECONDS = 6;
    const GOLD = [
      { value: 200, src: "assets/bill-200-gold.webp?v=1" },
      { value: 100, src: "assets/bill-100-gold.webp?v=1" },
      { value: 50, src: "assets/bill-50-gold.webp?v=1" }
    ];

    GOLD.forEach(item => {
      item.img = new Image();
      item.img.src = item.src;
      item.img.addEventListener("load", draw);
    });

    let snake, dir, nextDir, food, score, timer, alive, started;
    let billSide = 0;
    let gold = null;
    let goldTick = null;
    let eatenSinceGold = 0;
    let nextGoldAt = 2 + Math.floor(Math.random() * 7);

    // ---- שיא עצמי: נשמר בנפרד לכל מהירות ----
    const BEST_KEY = "snake:best";

    function readBests() {
      try {
        const data = JSON.parse(localStorage.getItem(BEST_KEY) || "{}");
        return data && typeof data === "object" && !Array.isArray(data) ? data : {};
      } catch (error) {
        return {};
      }
    }

    let bests = readBests();

    function showBest() {
      const value = bests[String(speedMs)];
      bestEl.textContent = (Number.isFinite(value) ? value : 0).toLocaleString("en-US");
    }

    function noteBest() {
      if (!scoreCounts()) return;
      const key = String(speedMs);
      if (score <= (bests[key] || 0)) return;
      bests[key] = score;
      try {
        localStorage.setItem(BEST_KEY, JSON.stringify(bests));
      } catch (error) {
        /* אין אחסון — השיא יוצג עד לרענון */
      }
      showBest();
    }

    // ---- לוח המובילים היומי: שלושת הניקודים הגבוהים של היום, נשמר בדפדפן ----
    const LEADERS_KEY = "snake:leaders";
    const NAME_KEY = "snake:name";

    function todayKey() {
      const now = new Date();
      return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
    }

    function readLeaders() {
      let list = [];
      try {
        list = JSON.parse(localStorage.getItem(LEADERS_KEY) || "[]");
      } catch (error) {
        return [];
      }
      if (!Array.isArray(list)) return [];
      const today = todayKey();
      return list
        .filter(item => item && item.date === today && typeof item.name === "string" && Number.isFinite(item.score))
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);
    }

    function renderLeaders() {
      const list = readLeaders();
      leadersBody.textContent = "";
      if (!list.length) {
        const row = document.createElement("tr");
        const cellEl = document.createElement("td");
        cellEl.colSpan = 3;
        cellEl.className = "empty";
        cellEl.textContent = "אין עדיין שיאים היום במהירות הרגילה — היו הראשונים.";
        row.append(cellEl);
        leadersBody.append(row);
        return;
      }
      list.forEach((item, index) => {
        const row = document.createElement("tr");
        if (index === 0) row.className = "top";
        const rank = document.createElement("td");
        rank.className = "rank";
        rank.textContent = String(index + 1);
        const name = document.createElement("td");
        name.textContent = item.name;
        const value = document.createElement("td");
        value.className = "value";
        value.textContent = item.score.toLocaleString("en-US");
        row.append(rank, name, value);
        leadersBody.append(row);
      });
    }

    function qualifiesForBoard(value) {
      if (value <= 0) return false;
      const list = readLeaders();
      return list.length < 3 || value > list[list.length - 1].score;
    }

    function saveLeader(name, value) {
      const list = readLeaders();
      const same = list.find(item => item.name === name);
      if (same) same.score = Math.max(same.score, value);
      else list.push({ name, score: value, date: todayKey() });
      list.sort((a, b) => b.score - a.score);
      try {
        localStorage.setItem(LEADERS_KEY, JSON.stringify(list.slice(0, 3)));
      } catch (error) {
        /* אחסון חסום (מצב פרטי) — הטבלה פשוט לא תישמר */
      }
      renderLeaders();
    }

    // סיום משחק: אם הניקוד נכנס לשלושת המקומות של היום — מציעים להקליד שם
    function endGame() {
      alive = false;
      started = false;
      clearInterval(timer);
      endGold();
      draw();

      overlayTitle.textContent = "נתקעת";
      overlayText.textContent = "הניקוד שלך: " + score;
      againBtn.textContent = "שחק שוב";
      recordForm.hidden = true;
      overlay.hidden = false;

      if (!scoreCounts() || !qualifiesForBoard(score)) return;

      const list = readLeaders();
      const place = list.findIndex(item => score > item.score);
      const rank = place === -1 ? list.length : place;
      recordLabel.textContent = rank === 0
        ? "שיא חדש! רוצה להיכנס ללוח המובילים של היום?"
        : "מקום " + (rank + 1) + " בלוח היומי! רוצה להיכנס?";
      try {
        recordName.value = localStorage.getItem(NAME_KEY) || "";
      } catch (error) {
        recordName.value = "";
      }
      recordForm.hidden = false;
      recordName.focus();
    }

    function showStart() {
      overlayTitle.textContent = "סנייק";
      overlayText.textContent = "לחצו על חץ כדי להתחיל";
      recordForm.hidden = true;
      againBtn.textContent = "התחל";
      overlay.hidden = false;
    }

    function reset() {
      snake = [
        { x: 5, y: 5 },
        { x: 4, y: 5 },
        { x: 3, y: 5 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      headAngle = headTargetAngle();
      score = 0;
      alive = true;
      started = false;
      billSide = 0;
      endGold();
      eatenSinceGold = 0;
      nextGoldAt = 2 + Math.floor(Math.random() * 7);
      scoreEl.textContent = "0";
      showBest();
      clearInterval(timer);
      placeFood();
      showStart();
      draw();
    }

    function begin() {
      if (started || !alive) return;
      started = true;
      ensureAudio();
      overlay.hidden = true;
      clearInterval(timer);
      timer = setInterval(step, speedMs);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
          kind: Math.floor(Math.random() * MONEY.length)
        };
      } while (
        snake.some(part => part.x === food.x && part.y === food.y) ||
        (gold && gold.x === food.x && gold.y === food.y)
      );
    }

    // הערך יורד בצעד שווה של שישית בכל שנייה (1800, 1500, 1200...), עד שהוא נעלם אחרי 6 שניות
    function goldValue() {
      if (!gold) return 0;
      const start = GOLD[gold.kind].value * GOLD_FACTOR;
      const seconds = Math.floor((performance.now() - gold.spawnedAt) / 1000);
      return Math.max(0, Math.round(start - (start / GOLD_SECONDS) * seconds));
    }

    function endGold() {
      gold = null;
      clearInterval(goldTick);
      goldTick = null;
    }

    function spawnGold() {
      if (gold) return;
      let spot;
      do {
        spot = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (
        snake.some(part => part.x === spot.x && part.y === spot.y) ||
        (food && food.x === spot.x && food.y === spot.y)
      );

      gold = {
        x: spot.x,
        y: spot.y,
        spawnedAt: performance.now(),
        kind: Math.floor(Math.random() * GOLD.length)
      };
      eatenSinceGold = 0;
      nextGoldAt = 2 + Math.floor(Math.random() * 7);

      clearInterval(goldTick);
      goldTick = setInterval(() => {
        if (!gold) return;
        if (performance.now() - gold.spawnedAt >= GOLD_SECONDS * 1000) endGold();
        draw();
      }, 250);
    }

    function setDir(x, y) {
      if (!alive) return;
      if (x === -dir.x && y === -dir.y) return;
      nextDir = { x, y };
      if (!started) {
        dir = nextDir;
        begin();
      }
    }

    function step() {
      if (!alive) return;
      dir = nextDir;
      // יציאה מהלוח בצד אחד והמשך מהצד השני
      const head = {
        x: (snake[0].x + dir.x + COLS) % COLS,
        y: (snake[0].y + dir.y + ROWS) % ROWS
      };
      const eats = head.x === food.x && head.y === food.y;
      const eatsGold = gold !== null && head.x === gold.x && head.y === gold.y;
      // הזנב מתפנה באותה תנועה, ולכן מותר להיכנס לתא שלו כשלא אוכלים
      const body = (eats || eatsGold) ? snake : snake.slice(0, -1);

      if (body.some(part => part.x === head.x && part.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);
      if (eats) {
        if (scoreCounts()) {
          score += MONEY[food.kind].value;
          scoreEl.textContent = String(score);
          noteBest();
        }
        playCash(false);
        billSide = (billSide + 1) % 2;
        placeFood();
        // כל 2–8 שטרות רגילים מופיע שטר זהוב נוסף
        eatenSinceGold++;
        if (!gold && eatenSinceGold >= nextGoldAt) spawnGold();
      }
      if (eatsGold) {
        if (scoreCounts()) {
          score += goldValue();
          scoreEl.textContent = String(score);
          noteBest();
        }
        playCash(true);
        endGold();
      }
      if (!eats && !eatsGold) {
        snake.pop();
      }
      draw();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // מכניס את התמונה לתיבה בלי לעוות אותה, כך שהמטבע נשאר עגול והשטר נשאר שטוח
    function fitImage(img, boxW, boxH) {
      if (img.complete && img.naturalWidth) {
        const scale = Math.min(boxW / img.naturalWidth, boxH / img.naturalHeight);
        return { w: img.naturalWidth * scale, h: img.naturalHeight * scale };
      }
      return { w: boxW, h: boxW * 0.57 };
    }

    function drawBill(x, y) {
      const item = MONEY[food.kind];
      const img = billSide === 0 ? item.frontImg : item.backImg;
      const size = fitImage(img, cell * 0.9, cell * 0.56);
      ctx.save();
      ctx.translate(x + cell / 2, y + cell / 2);
      ctx.rotate(-0.18);
      if (img.complete && img.naturalWidth) {
        ctx.drawImage(img, -size.w / 2, -size.h / 2, size.w, size.h);
      } else {
        roundRect(-size.w / 2, -size.h / 2, size.w, size.h, cell * 0.06);
        ctx.fillStyle = "#2f7fb5";
        ctx.fill();
      }
      ctx.restore();
    }

    function drawGold(x, y) {
      if (!gold) return;
      const now = performance.now();
      const item = GOLD[gold.kind];
      const left = Math.max(0, 1 - (now - gold.spawnedAt) / (GOLD_SECONDS * 1000));
      const value = goldValue();
      const pulse = 1 + Math.sin(now / 170) * 0.045;
      const size = fitImage(item.img, cell * 0.92 * pulse, cell * 0.58 * pulse);
      const cx = x + cell / 2;
      const cy = y + cell / 2;

      // הילה זהובה
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.18);
      ctx.shadowColor = "rgba(226, 163, 34, 0.9)";
      ctx.shadowBlur = cell * 0.4;
      if (item.img.complete && item.img.naturalWidth) {
        ctx.drawImage(item.img, -size.w / 2, -size.h / 2, size.w, size.h);
      } else {
        roundRect(-size.w / 2, -size.h / 2, size.w, size.h, cell * 0.06);
        ctx.fillStyle = "#d9a12a";
        ctx.fill();
      }
      ctx.restore();

      // ערך נוכחי
      ctx.font = "bold " + Math.round(cell * 0.21) + "px Segoe UI, Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#8a5a00";
      ctx.fillText(value.toLocaleString("en-US"), cx, y + cell * 0.1);

      // פס זמן
      const barW = cell * 0.74;
      const barH = Math.max(3, cell * 0.075);
      const bx = x + (cell - barW) / 2;
      const by = y + cell - barH - cell * 0.09;
      ctx.fillStyle = "rgba(90, 58, 5, 0.18)";
      roundRect(bx, by, barW, barH, barH);
      ctx.fill();
      ctx.fillStyle = "#b8791a";
      roundRect(bx, by, barW * left, barH, barH);
      ctx.fill();
    }

    function segX(part) { return part.x * cell + cell / 2; }
    function segY(part) { return part.y * cell + cell / 2; }

    // הגוף נמשך כקו אחד רציף מהראש עד הזנב, כך שכל החוליות מחוברות זו לזו.
    // בחציה של הלוח הקו נשבר כדי לא למתוח קו לרוחב כל המסך.
    function traceBody() {
      ctx.beginPath();
      let open = false;
      for (let i = 0; i < snake.length; i++) {
        const part = snake[i];
        const prev = i > 0 ? snake[i - 1] : null;
        const jump = prev && (Math.abs(part.x - prev.x) > 1 || Math.abs(part.y - prev.y) > 1);
        if (!open || jump) ctx.moveTo(segX(part), segY(part));
        else ctx.lineTo(segX(part), segY(part));
        open = true;
      }
    }

    function drawBody() {
      if (snake.length < 1) return;
      const width = cell * 0.78;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = "#1f6f5b";
      ctx.lineWidth = width;
      traceBody();
      ctx.stroke();
      // פס בהיר לאורך הגוף — נותן תחושת קשקשים במקום קוביות נפרדות
      ctx.strokeStyle = "#2f8f74";
      ctx.lineWidth = width * 0.56;
      traceBody();
      ctx.stroke();
    }

    // הראש מסתובב יחד עם הנחש: הזווית מחושבת מכיוון התנועה ומוחלקת בכל פריים
    let headAngle = 0;

    function headTargetAngle() {
      return Math.atan2(dir.x, -dir.y);
    }

    function drawHead(part) {
      const cx = segX(part);
      const cy = segY(part);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(headAngle);

      if (face.complete && face.naturalWidth) {
        // הפנים נחתכו מהתמונה עם רקע שקוף, ולכן מציירים אותן כמו שהן —
        // בלי עיגול ובלי מסכה.
        const h = cell * 1.18;
        const w = h * (face.naturalWidth / face.naturalHeight);
        ctx.drawImage(face, -w / 2, -h / 2, w, h);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, cell / 2 - 1, 0, Math.PI * 2);
        ctx.fillStyle = "#c5d7e6";
        ctx.fill();
      }

      ctx.restore();
    }

    // הזווית מתקרבת בעדינות לכיוון התנועה בכל ציור, וב־requestAnimationFrame
    // הציור עצמו רץ כל פריים — כך הסיבוב נראה רציף ולא מדלג.
    function easeHeadAngle() {
      const target = headTargetAngle();
      const diff = ((target - headAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      if (Math.abs(diff) < 0.002) headAngle = target;
      else headAngle += diff * 0.22;
    }

    function animate() {
      draw();
      requestAnimationFrame(animate);
    }

    function draw() {
      easeHeadAngle();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          ctx.fillStyle = (x + y) % 2 === 0 ? "#f7f3ec" : "#efe8dc";
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }

      drawBill(food.x * cell, food.y * cell);
      if (gold) drawGold(gold.x * cell, gold.y * cell);

      drawBody();
      drawHead(snake[0]);
    }

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowUp: [0, -1],
        ArrowDown: [0, 1],
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0],
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0]
      };
      const next = keys[event.key];
      if (!next) return;
      event.preventDefault();
      setDir(next[0], next[1]);
    });

    let touchStart = null;
    canvas.addEventListener("touchstart", event => {
      const t = event.changedTouches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    canvas.addEventListener("touchend", event => {
      if (!touchStart) return;
      const t = event.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
    }, { passive: true });

    speedBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        speedMs = Number(btn.dataset.ms);
        speedBtns.forEach(other => other.classList.toggle("is-on", other === btn));
        if (!scoreCounts()) {
          score = 0;
          scoreEl.textContent = "0";
        }
        showBest();
        if (started && alive) {
          clearInterval(timer);
          timer = setInterval(step, speedMs);
        }
      });
    });

    againBtn.addEventListener("click", () => {
      if (alive && !started) begin();
      else reset();
    });

    recordForm.addEventListener("submit", event => {
      event.preventDefault();
      const name = (recordName.value.trim().slice(0, 14) || "אנונימי");
      try {
        localStorage.setItem(NAME_KEY, name);
      } catch (error) {
        /* אין אחסון — השם לא יישמר לפעם הבאה */
      }
      saveLeader(name, score);
      recordForm.hidden = true;
      overlayText.textContent = "נרשמת בלוח המובילים עם " + score.toLocaleString("en-US") + "!";
    });

    recordSkip.addEventListener("click", () => {
      recordForm.hidden = true;
      overlayText.textContent = "הניקוד שלך: " + score;
    });

    face.addEventListener("load", draw);
    renderLeaders();
    reset();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
