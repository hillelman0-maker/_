<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ברוך הבא לאתר</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6778;
      --paper: #f6f3ee;
      --card: #fffdf9;
      --accent: #1f6f5b;
      --accent-soft: #e6f3ee;
      --line: #e4ddd3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #efe6d6 0, transparent 36%),
        radial-gradient(circle at 90% 90%, #dceee7 0, transparent 32%),
        var(--paper);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    main {
      position: relative;
      width: min(920px, 100%);
      min-height: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 56px 56px 48px;
      box-shadow: 0 18px 50px rgba(40, 32, 20, 0.08);
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      align-items: center;
      gap: 12px;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--muted);
      max-width: 34rem;
    }

    .stage {
      position: relative;
      height: 340px;
    }

    .person {
      position: absolute;
      left: 18px;
      bottom: 18px;
      width: 150px;
      height: 250px;
    }

    .head {
      position: relative;
      z-index: 3;
      width: 124px;
      height: 124px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #fff;
      box-shadow: 0 10px 22px rgba(40, 32, 20, 0.16);
      background: #c5d7e6;
    }

    .head img {
      width: 148%;
      height: auto;
      margin-right: -24%;
      margin-top: -2%;
      display: block;
    }

    .torso {
      width: 46px;
      height: 52px;
      margin: -10px auto 0;
      border-radius: 14px 14px 8px 8px;
      background:
        repeating-linear-gradient(
          90deg,
          #f4f2f8 0 3px,
          #ddd6ea 3px 5px
        );
      border: 2px solid #c9bfd8;
      position: relative;
      z-index: 2;
    }

    .torso::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8px;
      right: 8px;
      height: 10px;
      background: #7d6aa8;
      border-radius: 0 0 8px 8px;
    }

    .legs {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 2px;
    }

    .leg {
      width: 8px;
      height: 28px;
      background: #3d4654;
      border-radius: 0 0 6px 6px;
    }

    .arm {
      position: absolute;
      z-index: 4;
      top: 138px;
      left: 86px;
      width: 52px;
      height: 9px;
      background: #e7c3a8;
      border-radius: 8px;
      transform-origin: 4px 50%;
      animation: throw 1.35s ease-in-out infinite;
    }

    .arm.rest {
      left: 36px;
      top: 154px;
      width: 22px;
      height: 8px;
      animation: none;
      transform: rotate(36deg);
      transform-origin: right center;
      z-index: 1;
    }

    .arm::after {
      content: "";
      position: absolute;
      right: -7px;
      top: -4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e7c3a8;
      box-shadow: inset 0 0 0 2px #d7ad90;
    }

    .bills {
      position: absolute;
      left: 128px;
      bottom: 118px;
      width: 0;
      height: 0;
      z-index: 5;
    }

    .bill {
      position: absolute;
      width: 96px;
      height: 46px;
      border-radius: 6px;
      background:
        linear-gradient(160deg, #f4a06a 0%, #e15a38 42%, #c23328 100%);
      color: #fff8ea;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.02em;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 16px rgba(140, 40, 30, 0.28);
      border: 2px solid rgba(255, 236, 205, 0.7);
      opacity: 0;
      animation: fly 1.35s linear infinite;
      animation-delay: var(--d);
    }

    .bill span {
      font-size: 13px;
      margin-inline-end: 3px;
    }

    @keyframes throw {
      0%, 100% { transform: rotate(28deg); }
      38% { transform: rotate(-18deg); }
      52% { transform: rotate(74deg); }
      70% { transform: rotate(40deg); }
    }

    @keyframes fly {
      0% {
        opacity: 0;
        transform: translate(0, 12px) rotate(-28deg) scale(0.72);
      }
      14% { opacity: 1; }
      72% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(460px, var(--rise)) rotate(32deg) scale(1);
      }
    }

    @media (max-width: 720px) {
      main {
        grid-template-columns: 1fr;
        padding: 36px 24px 28px;
        min-height: 0;
      }

      .stage {
        height: 280px;
        order: -1;
      }

      .bill {
        animation-name: fly-narrow;
      }
    }

    @keyframes fly-narrow {
      0% {
        opacity: 0;
        transform: translate(0, 12px) rotate(-28deg) scale(0.72);
      }
      14% { opacity: 1; }
      72% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(220px, var(--rise)) rotate(32deg) scale(1);
      }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <div class="mark">עמוד הבית</div>
      <h1>ברוך הבא לאתר</h1>
      <p>שמחים שאתם כאן. זהו עמוד הפתיחה של האתר, מוכן להמשך בנייה.</p>
    </div>

    <div class="stage" aria-hidden="true">
      <div class="bills">
        <div class="bill" style="--d: 0s; --rise: -70px;"><span>₪</span>200</div>
        <div class="bill" style="--d: 0.28s; --rise: -18px;"><span>₪</span>200</div>
        <div class="bill" style="--d: 0.56s; --rise: -110px;"><span>₪</span>200</div>
        <div class="bill" style="--d: 0.84s; --rise: -42px;"><span>₪</span>200</div>
        <div class="bill" style="--d: 1.08s; --rise: -88px;"><span>₪</span>200</div>
      </div>
      <div class="person">
        <div class="head"><img src="assets/portrait.png" alt=""></div>
        <div class="arm rest"></div>
        <div class="arm"></div>
        <div class="torso"></div>
        <div class="legs">
          <div class="leg"></div>
          <div class="leg"></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
