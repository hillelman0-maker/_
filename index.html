<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ברוך הבא לאתר</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6778;
      --paper: #f6f3ee;
      --card: #fffdf9;
      --accent: #1f6f5b;
      --accent-soft: #e6f3ee;
      --line: #e4ddd3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #efe6d6 0, transparent 36%),
        radial-gradient(circle at 90% 90%, #dceee7 0, transparent 32%),
        var(--paper);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    main {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 56px 48px;
      box-shadow: 0 18px 50px rgba(40, 32, 20, 0.08);
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--muted);
      max-width: 36rem;
    }

    @media (max-width: 600px) {
      main {
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">עמוד הבית</div>
    <h1>ברוך הבא לאתר</h1>
    <p>שמחים שאתם כאן. זהו עמוד הפתיחה של האתר, מוכן להמשך בנייה.</p>
  </main>
</body>
</html>
