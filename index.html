<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOBLIL GAMES</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6778;
      --paper: #f6f3ee;
      --card: #fffdf9;
      --accent: #1f6f5b;
      --accent-soft: #e6f3ee;
      --line: #e4ddd3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #efe6d6 0, transparent 36%),
        radial-gradient(circle at 90% 90%, #dceee7 0, transparent 32%),
        var(--paper);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    main {
      position: relative;
      width: min(920px, 100%);
      min-height: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 56px 56px 48px;
      box-shadow: 0 18px 50px rgba(40, 32, 20, 0.08);
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      align-items: center;
      gap: 12px;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    /* כותרת המותג: אותיות לטיניות גדולות בגרדיאנט ירוק־זהב */
    .brand {
      direction: ltr;
      text-align: right;
      font-size: clamp(2.5rem, 8vw, 4.1rem);
      font-weight: 900;
      line-height: 0.98;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #1f6f5b 0%, #2f9b78 52%, #c9a24a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--muted);
      max-width: 34rem;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .tile {
      display: block;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: var(--card);
      box-shadow: 0 10px 22px rgba(40, 32, 20, 0.1);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .tile img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 16px 32px rgba(40, 32, 20, 0.18);
    }

    @media (max-width: 460px) {
      .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    }

    .stage {
      position: relative;
      height: 340px;
    }

    .person {
      position: absolute;
      left: 6px;
      bottom: 4px;
      width: 180px;
      height: 334px;
      filter: drop-shadow(0 14px 24px rgba(40, 32, 20, 0.2));
    }

    /* הגוף מחליפת החום, והפנים של האדם (כולל הזקן) מודבקות עליו */
    .person img {
      display: block;
      height: 330px;
      width: auto;
    }

    /* נקודת הזריקה — היד שלו */
    .bills {
      position: absolute;
      left: 148px;
      bottom: 81px;
      width: 0;
      height: 0;
      z-index: 7;
    }

    /* הבזק קטן ביד ברגע הזריקה */
    .flick {
      position: absolute;
      left: -16px;
      top: -16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 240, 205, 0.95), rgba(255, 240, 205, 0));
      animation: flick 1.35s ease-out infinite;
    }

    .flick::before,
    .flick::after {
      content: "";
      position: absolute;
      left: 26px;
      top: 50%;
      width: 30px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, rgba(31, 111, 91, 0.6), rgba(31, 111, 91, 0));
      transform-origin: left center;
      animation: dash 1.35s ease-out infinite;
    }

    .flick::before { --r: -24deg; transform: rotate(-24deg); }
    .flick::after { --r: 12deg; transform: rotate(12deg); animation-delay: 0.06s; }

    .bill {
      position: absolute;
      margin: -27px 0 0 -52px;
      width: 104px;
      height: 54px;
      border-radius: 4px;
      background-image: url("assets/bill-200-front.webp");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 10px 20px rgba(40, 70, 90, 0.22);
      opacity: 0;
      animation: fly 1.35s linear infinite;
      animation-delay: var(--d);
    }

    .bill.back {
      background-image: url("assets/bill-200-back.webp");
    }


    @keyframes flick {
      0% { opacity: 0; transform: scale(0.35); }
      5% { opacity: 1; transform: scale(1); }
      18% { opacity: 0; transform: scale(1.55); }
      100% { opacity: 0; transform: scale(1.55); }
    }

    @keyframes dash {
      0%, 3% { opacity: 0; transform: translateX(0) rotate(var(--r, 0deg)) scaleX(0.3); }
      11% { opacity: 0.85; }
      24% { opacity: 0; transform: translateX(20px) rotate(var(--r, 0deg)) scaleX(1); }
      100% { opacity: 0; }
    }

    /* השטר יוצא מהיד, מסתובב באוויר ונסוג */
    @keyframes fly {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(-42deg) scale(0.32);
      }
      9% { opacity: 1; }
      22% {
        transform: translate(calc(var(--tx, 300px) * 0.2), -30px) rotate(26deg) scale(1.02);
      }
      64% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(var(--tx, 300px), var(--rise)) rotate(215deg) scale(1);
      }
    }

    @media (max-width: 720px) {
      main {
        grid-template-columns: 1fr;
        padding: 36px 24px 28px;
        min-height: 0;
      }

      .stage {
        height: 280px;
        order: -1;
      }

      .person {
        transform: scale(0.84);
        transform-origin: bottom left;
      }

      .bills {
        left: 125px;
        bottom: 65px;
      }

      .bill {
        width: 84px;
        height: 44px;
        margin: -22px 0 0 -42px;
        animation-name: fly-narrow;
      }
    }

    @keyframes fly-narrow {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(-42deg) scale(0.32);
      }
      9% { opacity: 1; }
      22% {
        transform: translate(calc(var(--tx, 190px) * 0.2), -24px) rotate(26deg) scale(1.02);
      }
      64% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(var(--tx, 190px), var(--rise)) rotate(215deg) scale(1);
      }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <div class="mark">עמוד הבית</div>
      <h1 class="brand">BOBLIL GAMES</h1>
      <p>חמישה משחקי דפדפן קטנים. בחרו משחק ולחצו על התמונה כדי להתחיל.</p>
      <div class="actions">
        <a class="tile" href="maze.html" aria-label="מבוך">
          <img src="assets/tile-maze.webp?v=1" alt="מבוך" loading="lazy">
        </a>
        <a class="tile" href="tetris.html" aria-label="טטריס">
          <img src="assets/tile-tetris.webp?v=1" alt="טטריס" loading="lazy">
        </a>
        <a class="tile" href="snake.html" aria-label="סנייק">
          <img src="assets/tile-snake.webp?v=1" alt="סנייק" loading="lazy">
        </a>
        <a class="tile" href="runner.html" aria-label="משחק דינוזאור">
          <img src="assets/tile-runner.webp?v=1" alt="משחק דינוזאור" loading="lazy">
        </a>
        <a class="tile" href="doodle.html" aria-label="דודלג'אמפ">
          <img src="assets/tile-doodle.webp?v=1" alt="דודלג'אמפ" loading="lazy">
        </a>
      </div>
    </div>

    <div class="stage" aria-hidden="true">
      <div class="bills">
        <div class="flick"></div>
        <div class="bill" style="--d: 0s; --rise: -8px; --tx: 300px;"></div>
        <div class="bill back" style="--d: 0.27s; --rise: 18px; --tx: 250px;"></div>
        <div class="bill" style="--d: 0.54s; --rise: 2px; --tx: 320px;"></div>
        <div class="bill back" style="--d: 0.81s; --rise: 24px; --tx: 235px;"></div>
        <div class="bill" style="--d: 1.08s; --rise: -18px; --tx: 285px;"></div>
      </div>
      <div class="person">
        <img src="assets/hero.png" alt="">
      </div>
    </div>
  </main>
</body>
</html>
